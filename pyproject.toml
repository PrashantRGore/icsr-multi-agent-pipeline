[project]
name            = "icsr-engine"
version         = "0.6.0"
requires-python = ">=3.11"
description     = "Zero-cost, privacy-first, local Multi-Agent ICSR Processing & Governance Engine"

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # LangGraph orchestration
    "langgraph>=0.2",
    "langchain-community>=0.2",
    "langgraph-checkpoint-sqlite>=3.1",
    # Auth
    "bcrypt>=4.0",
    # PII protection
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "cryptography>=42.0",
    # Ollama LLM client
    "ollama>=0.3",
    # Terminology / Vector store
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "owlready2>=0.46",
    "openpyxl>=3.1",
    # Drug normalisation
    "requests>=2.31",
    # Data processing
    "pandas>=2.2",
    "pyarrow>=16.0",
    # FDA SPL / E2B XML
    "lxml>=5.2",
    # Numerics
    "numpy>=1.26",
    # Graph (MAGMA intra-case)
    "networkx>=3.3",
    # HITL API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Testing
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
