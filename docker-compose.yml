# ═══════════════════════════════════════════════════════════════════════════════
# ICSR Multi-Agent HITL Server — docker-compose.yml
# ═══════════════════════════════════════════════════════════════════════════════
#
# Services:
#   ollama     — Ollama LLM server (CPU by default; see GPU notes below)
#   icsr-hitl  — ICSR HITL FastAPI server
#
# Usage:
#   # First time: pull model and create initial reviewer
#   ./scripts/docker_init.sh        # Linux/Mac
#   .\scripts\docker_init.ps1       # Windows
#
#   # Start stack
#   docker compose up -d
#
#   # View structured JSON logs
#   docker compose logs -f icsr-hitl | python -m json.tool
#
#   # Stop
#   docker compose down
#
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─── Ollama LLM Server ───────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: icsr-ollama
    restart: unless-stopped
    # ── Security: Ollama port NOT published to host ─────────────────────────────
    # Ollama has no built-in authentication. Exposing port 11434 to the host would
    # allow any process on the machine (or network) to invoke LLM inference directly,
    # bypassing the HITL API's X-API-Key authentication and audit trail.
    # The icsr-hitl container reaches Ollama exclusively via the internal Docker
    # network using http://ollama:11434 (set in environment below).
    # To inspect Ollama interactively during development, use:
    #   docker compose exec ollama ollama list
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    # ── GPU Support (NVIDIA) ──────────────────────────────────────────────────
    # Uncomment the block below if your host has an NVIDIA GPU and the
    # NVIDIA Container Toolkit is installed (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/).
    # For CPU-only inference (default), leave this block commented out.
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ─── ICSR HITL Server ────────────────────────────────────────────────────────
  icsr-hitl:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: icsr-hitl
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      # ── Network security: API bound to localhost only ─────────────────────────────
      # 127.0.0.1:8000 means the API is reachable ONLY from the local machine.
      # This is the safe default for a local portfolio/demo deployment.
      #
      # For enterprise deployment behind a reverse proxy (nginx, Caddy, Traefik):
      #   1. Remove this ports block entirely, or bind to a private network interface.
      #   2. Terminate TLS at the reverse proxy and forward only to this container.
      #   3. Restrict inbound traffic with firewall/security group rules.
      #
      # Do NOT expose 0.0.0.0:8000 to the internet without TLS and access controls.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Override Ollama host to use the Docker service name (internal network only)
      - OLLAMA_HOST=http://ollama:11434
      # Set APP_ENV=production to enforce encryption key requirements at startup
      # APP_ENV=production
    volumes:
      # Persist audit databases, checkpoints, and PII maps across container restarts
      - icsr_audit:/app/audit
      - icsr_checkpoints:/app/checkpoints
      - icsr_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"


# ─── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  ollama_models:
    driver: local
  icsr_audit:
    driver: local
  icsr_checkpoints:
    driver: local
  icsr_data:
    driver: local
